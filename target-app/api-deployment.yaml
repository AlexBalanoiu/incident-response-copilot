apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: incident-copilot
  labels:
    app: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: incident-copilot/api-service:v1
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: appdb
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: incident-copilot
spec:
  selector:
    app: api-service
  ports:
    - port: 5000