apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-injector
  namespace: incident-copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-injector-role
  namespace: incident-copilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-injector-binding
  namespace: incident-copilot
subjects:
  - kind: ServiceAccount
    name: chaos-injector
    namespace: incident-copilot
roleRef:
  kind: Role
  name: chaos-injector-role
  apiGroup: rbac.authorization.k8s.io